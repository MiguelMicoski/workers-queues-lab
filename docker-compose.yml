services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_sync
      POSTGRES_USER: ordersync
      POSTGRES_PASSWORD: ordersync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordersync -d order_sync"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      DEBUG: 0
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15
