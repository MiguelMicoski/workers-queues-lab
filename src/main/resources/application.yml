spring:
  application:
    name: order-sync
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_sync}
    username: ${DB_USER:ordersync}
    password: ${DB_PASSWORD:ordersync}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:local}
        secret-key: ${AWS_SECRET_ACCESS_KEY:local}
      sqs:
        enabled: true
      sns:
        enabled: true
      endpoint: ${AWS_ENDPOINT:}

app:
  sns:
    order-events-topic: ${SNS_ORDER_EVENTS_TOPIC:order-events}
  sqs:
    order-processing-queue: ${SQS_ORDER_PROCESSING_QUEUE:order-processing}
    order-processing-dlq: ${SQS_ORDER_PROCESSING_DLQ:order-processing-dlq}
  outbox:
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
  partner:
    base-url: ${PARTNER_API_BASE_URL:http://localhost:8080/partner}

logging:
  level:
    com.micoski.ordersync: INFO
